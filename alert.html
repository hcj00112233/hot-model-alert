<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新模型发布雷达</title>
<style>
  :root {
    --navy: #16324F;
    --red: #C8102E;
    --blue: #1D6FB8;
    --green: #1E9E5A;
    --bg: #F5F7FA;
    --card: #FFFFFF;
    --line: #E4E9EF;
    --muted: #6B7A8C;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: #22303E;
    line-height: 1.5;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; }

  header.page { margin-bottom: 24px; }
  header.page h1 { font-size: 26px; color: var(--navy); letter-spacing: .5px; }
  header.page .sub { margin-top: 6px; font-size: 13px; color: var(--muted); }
  header.page .sub b { color: var(--navy); font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: 1px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 30px;
  }
  @media (max-width: 1080px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 820px)  { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px)  { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .card .cname { font-size: 15px; font-weight: 700; color: var(--navy); }
  .card .handle { font-size: 12px; color: var(--muted); margin: 2px 0 10px; }
  .card .handle a { color: var(--muted); text-decoration: none; }
  .card .handle a:hover { color: var(--blue); }
  .card .status-fail { font-size: 12px; color: var(--red); margin-top: 8px; }
  .post {
    display: block;
    text-decoration: none;
    color: inherit;
    border-top: 1px solid var(--line);
    padding: 8px 0;
  }
  .post:hover .ptext { color: var(--blue); }
  .pmeta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .ptext {
    font-size: 12.5px;
    color: #33455A;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .pstats { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .empty-posts { font-size: 12px; color: var(--muted); padding: 8px 0; border-top: 1px solid var(--line); }

  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    border-radius: 4px;
    padding: 1px 6px;
    line-height: 1.6;
    color: #fff;
    flex: none;
  }
  .badge.release { background: var(--red); }
  .badge.update  { background: var(--blue); }
  .badge.new {
    background: #E7F6EE;
    color: var(--green);
    border: 1px solid var(--green);
    font-weight: 700;
  }

  h2.section { font-size: 17px; color: var(--navy); margin-bottom: 12px; }
  .timeline {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .ev {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 16px;
    border-top: 1px solid var(--line);
    text-decoration: none;
    color: inherit;
  }
  .ev:first-child { border-top: none; }
  .ev:hover { background: #F0F5FA; }
  .ev .company { font-size: 12px; font-weight: 600; color: var(--navy); flex: none; width: 130px; }
  .ev .etitle {
    flex: 1;
    font-size: 13px;
    color: #33455A;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ev .etime { font-size: 11.5px; color: var(--muted); flex: none; }

  .state { padding: 50px 0; text-align: center; color: var(--muted); font-size: 14px; }
  .state.err { color: var(--red); }
  footer { margin-top: 26px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <h1>新模型发布雷达</h1>
    <div class="sub"><span class="dot"></span>数据更新于 <b id="updated-at">—</b> · 每 30 分钟自动更新 · 监控 7 家 AI 公司官方 X 账号</div>
  </header>

  <div id="cards" class="grid"></div>

  <h2 class="section">发布 / 更新事件时间线</h2>
  <div id="timeline" class="timeline"></div>

  <footer>新模型发布雷达 · 运营内部看板 · 数据来源：X 官方账号公开帖子</footer>
</div>

<script>
(function () {
  var cardsEl = document.getElementById('cards');
  var tlEl = document.getElementById('timeline');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmtTime(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d)) return '—';
    return d.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  function relTime(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var s = (Date.now() - d.getTime()) / 1000;
    if (s < 0) s = 0;
    if (s < 60) return '刚刚';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
    if (s < 86400 * 30) return Math.floor(s / 86400) + ' 天前';
    return d.toLocaleDateString('zh-CN');
  }

  function isNew(iso) {
    var d = new Date(iso);
    return !isNaN(d) && (Date.now() - d.getTime()) < 86400000;
  }

  function fmtViews(v) {
    if (v == null) return '';
    if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M 次浏览';
    if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K 次浏览';
    return v + ' 次浏览';
  }

  function firstLine(text) {
    var l = String(text || '').split('\n')[0].trim();
    return l.length > 120 ? l.slice(0, 120) : l;
  }

  function typeBadge(t) {
    return t === 'release'
      ? '<span class="badge release">发布</span>'
      : '<span class="badge update">更新</span>';
  }

  function render(data) {
    document.getElementById('updated-at').textContent = fmtTime(data.updated_at);

    // 公司卡片
    var accounts = data.accounts || [];
    if (!accounts.length) {
      cardsEl.innerHTML = '<div class="state">暂无账号数据</div>';
    } else {
      cardsEl.innerHTML = accounts.map(function (a) {
        var posts = (a.posts || []).filter(function (p) { return p.type === 'release' || p.type === 'update'; }).slice(0, 3);
        var body;
        if (!a.ok) {
          body = '<div class="status-fail">抓取失败：' + esc(a.error || '账号不可用') + '</div>';
        } else if (!posts.length) {
          body = '<div class="empty-posts">近期暂无发布 / 更新动态</div>';
        } else {
          body = posts.map(function (p) {
            return '<a class="post" href="' + esc(p.url) + '" target="_blank" rel="noopener">' +
              '<div class="pmeta">' + typeBadge(p.type) + '<span>' + esc(relTime(p.time)) + '</span></div>' +
              '<div class="ptext">' + esc(firstLine(p.text)) + '</div>' +
              '<div class="pstats">' + (p.views != null ? '👁 ' + esc(fmtViews(p.views)) : '') + '</div>' +
              '</a>';
          }).join('');
        }
        return '<div class="card">' +
          '<div class="cname">' + esc(a.company) + '</div>' +
          '<div class="handle"><a href="https://x.com/' + esc(a.handle) + '" target="_blank" rel="noopener">@' + esc(a.handle) + '</a>' + (a.ok ? '' : '（不可用）') + '</div>' +
          body +
          '</div>';
      }).join('');
    }

    // 时间线
    var events = data.events || [];
    if (!events.length) {
      tlEl.innerHTML = '<div class="state">暂无发布 / 更新事件</div>';
    } else {
      tlEl.innerHTML = events.map(function (e) {
        return '<a class="ev" href="' + esc(e.url) + '" target="_blank" rel="noopener">' +
          typeBadge(e.type) +
          (isNew(e.time) ? '<span class="badge new">NEW</span>' : '') +
          '<span class="company">' + esc(e.company) + '</span>' +
          '<span class="etitle">' + esc(e.title) + '</span>' +
          '<span class="etime">' + esc(relTime(e.time)) + '</span>' +
          '</a>';
      }).join('');
    }
  }

  function showError(msg) {
    cardsEl.innerHTML = '';
    tlEl.innerHTML = '<div class="state err">数据加载失败：' + esc(msg) + '（请确认 data/hotalert-data.json 存在）</div>';
  }

  fetch('data/hotalert-data.json', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(render)
    .catch(function (e) {
      // file:// 下 Chrome 拦截 fetch：改用 <script> 加载 JS 包装数据
      var s = document.createElement('script');
      s.src = 'data/hotalert-data.js';
      s.onload = function () {
        if (window.HOTALERT_DATA) render(window.HOTALERT_DATA);
        else showError('数据文件为空');
      };
      s.onerror = function () { showError(e.message || String(e)); };
      document.head.appendChild(s);
    });
})();
</script>
</body>
</html>
